<!doctype html>
<!-- Font de la imatge de previsualització (assets/img/og.png, 1200×630).
     Per regenerar-la: fes una captura d'aquesta pàgina a 1200×630. -->
<html lang="ca">
<head>
<meta charset="utf-8">
<title>OG · Escola Can Serra</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--tinta-900); font-family: var(--font-body); }
  .og { position: relative; width: 1200px; height: 630px; }
  .lames { position: absolute; left: 0; right: 0; top: 0; height: 16px; background: var(--lames);
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(4% - 3px), transparent 0 4%); mask: repeating-linear-gradient(90deg, #000 0 calc(4% - 3px), transparent 0 4%); }
  .brand { position: absolute; left: 72px; top: 62px; display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 84px; height: 56px; }
  .brand .escola { display: block; font-family: var(--font-hand); font-weight: 700; font-size: 28px; line-height: 1; color: var(--tinta-700); }
  .brand .name { display: block; font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: -.03em; text-transform: uppercase; }
  h1 { position: absolute; left: 68px; top: 170px; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 104px; line-height: .94; letter-spacing: -.045em; }
  h1 .n { color: var(--vermell-500); }
  h1 .c span { display: inline-block; text-shadow: .03em .03em 0 var(--tinta-900); }
  h1 .c span:nth-child(1) { color: var(--vermell-500); } h1 .c span:nth-child(2) { color: var(--blau-500); }
  h1 .c span:nth-child(3) { color: var(--groc-500); } h1 .c span:nth-child(4) { color: var(--verd-500); }
  h1 .c span:nth-child(5) { color: var(--tinta-900); } h1 .c span:nth-child(6) { color: var(--vermell-500); }
  h1 mark { background: linear-gradient(transparent 58%, var(--groc-500) 58% 92%, transparent 92%); color: inherit; padding: 0 .06em; margin: 0 -.06em; }
  .tag { position: absolute; left: 72px; bottom: 56px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; background: var(--tinta-900); color: var(--paper); font-weight: 700; font-size: 22px; }
  .tag i { width: 12px; height: 12px; background: var(--groc-500); transform: rotate(45deg); border-radius: 2px; }
  .peaks { position: absolute; right: -30px; bottom: -4px; width: 560px; height: auto; filter: drop-shadow(6px 6px 0 var(--tinta-900)); }
  .stamp { position: absolute; right: 64px; top: 64px; width: 150px; height: 150px; border-radius: 50%; background: var(--groc-500); border: 3px solid var(--tinta-900); box-shadow: 5px 5px 0 var(--tinta-900); display: grid; place-items: center; text-align: center; font-family: var(--font-display); line-height: 1; transform: rotate(8deg); }
  .stamp small { display: block; font-family: var(--font-hand); font-weight: 700; font-size: 26px; }
  .stamp b { font-size: 42px; font-weight: 800; letter-spacing: -.03em; }
</style>
</head>
<body>
<div class="og">
  <div class="lames"></div>
  <div class="brand">
    <svg viewBox="0 0 120 80"><polygon points="0,52 24,6 48,52" fill="#ec3a2b"/><polygon points="36,52 60,6 84,52" fill="#1c9be6"/><polygon points="72,52 96,6 120,52" fill="#ffd60a"/><polygon points="18,80 42,34 66,80" fill="#22b14c"/><polygon points="54,80 78,34 102,80" fill="#16161d"/></svg>
    <div><span class="escola">Escola</span><span class="name">Can Serra</span></div>
  </div>
  <div class="stamp"><div><small>des de</small><b>1978</b></div></div>
  <h1><span class="n">5</span> <span class="c"><span>c</span><span>o</span><span>l</span><span>o</span><span>r</span><span>s</span></span>,<br><span class="n">1</span> serralada,<br><mark>molts cims.</mark></h1>
  <span class="tag"><i></i>Proposta de nou web · Barberà del Vallès</span>
  <svg class="peaks" viewBox="0 0 260 160">
    <polygon points="40,160 100,40 160,160" fill="#1c9be6"/>
    <polygon points="110,160 180,18 250,160" fill="#ffd60a"/>
    <polygon points="0,160 55,62 110,160" fill="#ec3a2b"/>
    <polygon points="70,160 135,78 200,160" fill="#22b14c"/>
    <polygon points="150,160 205,98 260,160" fill="#16161d"/>
  </svg>
</div>
</body>
</html>
